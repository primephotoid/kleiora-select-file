#:schema https://json.schemastore.org/any.json

env_files = ["backend/.env"]
root = "."
testdata_dir = "backend/testdata"
tmp_dir = "backend/tmp"

[build]
  args_bin = []
  bin = "./backend/tmp/main"
  cmd = "cd backend && go build -o ./tmp/main ./cmd/server/main.go"
  delay = 1000
  entrypoint = ["./backend/tmp/main"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "uploads", "frontend", "node_modules", ".next", ".git"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  ignore_dangerous_root_dir = false
  include_dir = ["backend"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "0s"
  log = "backend/build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

  [build.windows]
    args_bin = []
    bin = "backend\\tmp\\main.exe"
    cmd = "cd backend && go build -o ./tmp/main.exe ./cmd/server/main.go"
    entrypoint = ["backend\\tmp\\main.exe"]
    full_bin = ""
    post_cmd = []
    pre_cmd = []

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  mode = ""
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  app_start_timeout = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
